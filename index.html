<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
    <header>
        <div class="bot-icon">🤖</div>
        <div>
            <h1>FAQ Chatbot</h1>
            <p>Ask me anything about the product</p>
        </div>
        <span class="online">● Online</span>
    </header>

    <main id="chat">
        <div class="message bot">
            <div class="avatar">🤖</div>
            <div class="bubble">
                Hi! 👋 Ask me a question about the product and I'll find the closest FAQ answer for you.
            </div>
        </div>
    </main>

    <div class="suggestions">
        <button onclick="quickAsk('How does the chatbot work?')">How does it work?</button>
        <button onclick="quickAsk('What technology is used?')">Technology used?</button>
        <button onclick="quickAsk('What is cosine similarity?')">Cosine similarity?</button>
    </div>

    <form id="chatForm">
        <input id="question" type="text" placeholder="Type your question..." autocomplete="off">
        <button type="submit">Send ➤</button>
    </form>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("question");
const form = document.getElementById("chatForm");

function addMessage(text, type) {
    const row = document.createElement("div");
    row.className = "message " + type;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = type === "bot" ? "🤖" : "👤";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

async function sendQuestion(question) {
    if (!question.trim()) return;
    addMessage(question, "user");
    input.value = "";

    const response = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question: question})
    });

    const data = await response.json();
    addMessage(data.answer + (data.confidence > 0 ? `\n\nMatch confidence: ${data.confidence}%` : ""), "bot");
}

function quickAsk(question) {
    sendQuestion(question);
}

form.addEventListener("submit", (e) => {
    e.preventDefault();
    sendQuestion(input.value);
});
</script>
</body>
</html>
